apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: ["ReadWriteOnce"] # 노드 하나에서 읽기 쓰기 - DB는 이거면 됨
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # 이 Pod는 이 디스크를 쓴다. 선언
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
      containers:
      - image: grafana/grafana
        name: grafana
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: POSTGRES_PASSWORD
                name: postgres-credentials
        volumeMounts:
          - mountPath: /var/lib/grafana
            name: data
          - mountPath: /etc/grafana/provisioning/datasources
            name: datasources
          - mountPath: /etc/grafana/provisioning/dashboards
            name: dashboard-provider
          - mountPath: /var/lib/grafana/dashboards
            name: dashboards
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: grafana
  name: grafana
spec:
  ports:
  - port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: grafana
